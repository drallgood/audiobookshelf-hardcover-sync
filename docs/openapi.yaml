          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Sync]
      summary: Cancel an in-progress sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Sync cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
