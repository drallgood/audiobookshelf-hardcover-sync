openapi: 3.0.3
info:
  title: Audiobookshelf-Hardcover Sync API
  description: |
    This API allows you to manage sync profiles for synchronizing audiobooks between Audiobookshelf and Hardcover.
    
    ## Authentication
    
    The API uses JWT authentication. Include the JWT token in the `Authorization` header:
    
    ```
    Authorization: Bearer <token>
    ```

    When authentication is enabled, newly created profiles belong to the
    authenticated user. For authenticated `/api/profiles` APIs, users and
    viewers can access only their owned profiles; viewers are read-only, while
    administrators can access all profiles. Profile API responses never echo
    `audiobookshelf_token` or `hardcover_token`, regardless of authentication
    or role. Legacy ownerless profiles are administrator-only: they are not
    listed or accessible to ordinary users, and there is currently no way to
    assign one of these profiles to a user. Foreign and nonexistent profile
    requests return a non-enumerating `404`. The public
    `/api/status` endpoint remains scalar and redacted. Authentication disabled
    preserves unrestricted profile access.
    
    ## Rate Limiting
    
    The API is rate limited to 100 requests per minute per IP address.
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/drallgood/audiobookshelf-hardcover-sync
servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Profiles
    description: Manage sync profiles
  - name: Sync
    description: Control sync operations
  - name: Status
    description: Check sync status
  - name: Edition Draft
    description: Prepare read-only edition candidates from Audiobookshelf source metadata

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Profile not found"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data

    AcceptedSyncRun:
      type: object
      required: [message, run_id, state, queued_at, dry_run]
      properties:
        message:
          type: string
          example: Sync started
        run_id:
          type: string
          description: Authoritative ID assigned to the accepted run.
          example: profile-123-1700000000000000000
        state:
          type: string
          enum: [queued]
          description: The accepted run is durably queued before worker launch; response delivery may race worker processing.
        queued_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
          description: True when the accepted run will not perform Hardcover mutations.
    
    Profile:
      type: object
      properties:
        id:
          type: string
          example: "profile-123"
        name:
          type: string
          example: "My Audiobooks"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully.
    
    ProfileConfig:
      type: object
      properties:
        audiobookshelfUrl:
          type: string
          example: "https://audiobooks.example.com"
        sync_config:
          type: object
          properties:
            libraryId:
              type: string
              example: "lib1"
            includeTags:
              type: array
              items:
                type: string
              example: ["hardcover"]
            excludeTags:
              type: array
              items:
                type: string
              example: ["exclusive"]
            audnexus_region:
              type: string
              description: Region preference stored for the profile. Values are trimmed and lowercased. `us`, `ca`, `uk`, `au`, `de`, `fr`, `es`, `in`, `it`, and `jp` are supported for Audnex draft discovery. `br` is retained for legacy Hardcover `ASIN:br` sync matching, but draft discovery treats it as unsupported, warns, and starts in the US. Other unsupported non-empty values warn and normalize to `us`. An explicit empty string clears the saved preference; omitting this field preserves it.
            state_file:
              type: string
              description: Optional relative state-file path. Absolute paths and relative paths that lexically escape the effective data directory are rejected; when paths.data_dir is empty, /data is used. The profile-specific filename component, including the encoded profile ID, must fit the supported 255-byte baseline.
              pattern: '^(?!/).*$'
            dry_run:
              type: boolean
              example: false
    
    ProfileWithConfig:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            config:
              $ref: '#/components/schemas/ProfileConfig'

    EditionSourceDraft:
      type: object
      description: Read-only edition candidate built from one expanded Audiobookshelf item. The handler reads Audiobookshelf and may read Audnex; it makes no Hardcover requests and performs no catalogue mutation. `metadata_preview` is present only for audiobooks, and `ebook_candidate` is present only for ebooks.
      required: [abs_item_id, reading_format, dry_run, eligible, source_identifiers]
      properties:
        abs_item_id:
          type: string
          description: Audiobookshelf library item ID used for this draft.
        reading_format:
          type: string
          enum: [audiobook, ebook]
          description: Format inferred from the expanded Audiobookshelf item.
        dry_run:
          type: boolean
          description: The profile's sync dry-run setting. This draft endpoint itself remains read-only regardless of this value.
        eligible:
          type: boolean
          description: True when a non-empty source ASIN or an ISBN accepted by shape is available. For audiobooks, a malformed non-empty source ASIN remains eligible, is retained in the draft, and produces an `invalid_source_asin` warning with `region_status` `unknown`; Audnex lookup is skipped. An ISBN with a bad checksum remains a candidate with a validity warning, so checksum warnings do not by themselves make an ISBN-shaped value ineligible.
        ineligible_reason:
          type: string
          description: Present when the source item has neither a non-empty ASIN nor an ISBN accepted by shape; author or date warnings do not change eligibility.
        source_identifiers:
          $ref: '#/components/schemas/EditionDraftSourceIdentifiers'
        region_status:
          type: string
          enum: [confirmed, unknown, temporarily_unavailable, not_applicable]
          description: Audiobook source-ASIN lookup state. `confirmed` means Audnex returned the same ASIN in the reported region; `unknown` means the supported-region sweep completed without a matching ASIN or the source ASIN was malformed; `temporarily_unavailable` means a rate-limit or transient error stopped the sweep; `not_applicable` means an audiobook has no source ASIN. Omitted for ebooks.
        confirmed_region:
          type: string
          enum: [us, ca, uk, au, de, fr, es, in, it, jp]
          description: Audnex region that returned the exact source ASIN. Omitted unless the region is confirmed; it is not inferred from the configured preference.
        audible_identifier_candidate:
          $ref: '#/components/schemas/AudibleIdentifierCandidate'
        metadata_preview:
          $ref: '#/components/schemas/AudiobookMetadataPreview'
        ebook_candidate:
          $ref: '#/components/schemas/EbookEditionCandidate'
        warnings:
          type: array
          description: >-
            Non-fatal source or draft issues. Retryable Audnex failures are
            returned here with `retryable: true` and a
            `temporarily_unavailable` region status; they do not cause a
            guessed region to be returned.
          items:
            $ref: '#/components/schemas/EditionDraftWarning'

    EditionDraftSourceIdentifiers:
      type: object
      description: Source identifiers read from Audiobookshelf and trimmed of surrounding whitespace. The ASIN is retained as supplied, is the bare source value, and never includes a region suffix; the source ISBN retains its formatting apart from surrounding whitespace.
      properties:
        asin:
          type: string
          description: Bare Audiobookshelf ASIN, including malformed non-empty source values. A confirmed marketplace and a submitted regional identifier are represented separately.
        isbn:
          type: string
          description: Audiobookshelf's source ISBN, trimmed but otherwise unchanged.

    AudibleIdentifierCandidate:
      type: object
      description: Audiobook identifier candidate. Present for audiobooks, including when no source ASIN is available. The ASIN remains the bare source value; region is empty when Audnex has not confirmed a marketplace, so clients must not assume US. This candidate does not write `edition.asin` or create a Hardcover mapping.
      required: [asin, region, correction_allowed]
      properties:
        asin:
          type: string
          description: Bare source ASIN when present, retained with its source casing even when malformed. Empty when the ABS item has no ASIN.
        region:
          type: string
          description: Confirmed Audnex region, or an empty string when unknown, temporarily unavailable, or not applicable. A later user correction may supply a regional Audible identifier, including the Audible-only `br` region.
        correction_allowed:
          type: boolean
          description: Whether the regional Audible identifier can be corrected in a later add-edition workflow.

    EditionDraftISBNFields:
      type: object
      properties:
        isbn_10:
          type: string
          description: Normalized ISBN-10 candidate when available. A counterpart is present only when it can be derived from a valid source checksum.
        isbn_13:
          type: string
          description: Normalized ISBN-13 candidate when available. A counterpart is present only when it can be derived from a valid source checksum.
        isbn_10_valid:
          type: boolean
          description: Checksum validity for the ISBN-10 value when present.
        isbn_13_valid:
          type: boolean
          description: Checksum validity for the ISBN-13 value when present.

    AudiobookMetadataPreview:
      allOf:
        - $ref: '#/components/schemas/EditionDraftISBNFields'
        - type: object
          description: Read-only audiobook metadata preview. The fields are not editable through this endpoint.
          required: [title, edition_information, audio_seconds]
          properties:
            title: {type: string}
            subtitle: {type: string}
            author: {type: string}
            narrator: {type: string}
            publisher: {type: string}
            description: {type: string}
            language: {type: string}
            release_date:
              type: string
              format: date
              description: Audnex release date for the confirmed source ASIN region when available; otherwise the normalized Audiobookshelf `publishedDate`, then `publishedYear`. If the Audiobookshelf date is an ambiguous slash-formatted value, it is ignored in favor of `publishedYear` when available.
            edition_format: {type: string}
            edition_information:
              type: string
              enum: [Abridged, Unabridged]
            audio_seconds: {type: integer}

    EbookEditionCandidate:
      allOf:
        - $ref: '#/components/schemas/EditionDraftISBNFields'
        - type: object
          description: Ebook candidate fields suitable for a later format-aware add-edition workflow. This GET endpoint does not accept edits or create an edition.
          required: [title, edition_format, corrected_isbn]
          properties:
            title: {type: string}
            subtitle: {type: string}
            author: {type: string}
            asin:
              type: string
              description: Source Kindle ASIN when present.
            release_date:
              type: string
              format: date
              description: Normalized Audiobookshelf published date, falling back to published year when available. Ambiguous slash-formatted dates are ignored in favor of `publishedYear` when available.
            edition_format:
              type: string
              enum: [Ebook]
              description: Fixed to `Ebook` for an ebook candidate.
            corrected_isbn:
              type: string
              description: Optional replacement ISBN slot; empty in the source draft until a user or client supplies a correction to a later workflow.

    EditionDraftWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing_identifier, invalid_isbn, invalid_source_asin, date_unavailable, missing_author, language_defaults_to_english, published_date_unrecognized, published_date_ambiguous, unsupported_audnex_region, audnex_temporarily_unavailable, audnex_date_unrecognized]
          description: Current warning code identifying the source or draft issue. `invalid_source_asin` means a non-empty audiobook ASIN is not exactly 10 ASCII alphanumeric characters; the draft remains eligible and region status is `unknown`. `invalid_isbn` covers unsupported ISBN shape and a bad checksum; a bad-checksum ISBN that has a supported shape remains eligible, with its validity flag false. `published_date_ambiguous` means both month-first and day-first slash parsing succeed, so `publishedYear` is used when available.
        message:
          type: string
          description: Human-readable detail for this warning.
        retryable:
          type: boolean
          description: Present and true when the caller can retry after a temporary Audnex failure; omitted for non-retryable warnings.

    AggregateSyncStatus:
      type: object
      description: Scalar status exposed by the public aggregate status endpoint. Per-book arrays are available from the authenticated run-details endpoint.
      properties:
        profile_id:
          type: string
        profile_name:
          type: string
        last_attempted_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent run was accepted, including dry-run, failed, or canceled runs.
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully; null when no such run exists.
        snapshot:
          $ref: '#/components/schemas/AggregateSnapshot'

    AggregateSnapshot:
      type: object
      description: Scalar current-run snapshot used for inexpensive aggregate polling.
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, books_total, processed_so_far, outcome_counts, unattempted_count]
      properties:
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and a would_sync outcome represents planned work.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase for this run.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; zero when processed_so_far reaches books_total or the total is unknown.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet.
        processed_so_far:
          type: integer
          description: Number of books processed so far, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'

    OutcomeCounts:
      type: object
      required: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
      properties:
        synced: {type: integer}
        already_current: {type: integer}
        skipped: {type: integer}
        needs_review: {type: integer}
        not_found: {type: integer}
        failed: {type: integer}
        would_sync: {type: integer}

    BookOutcomeRecord:
      type: object
      required: [book_id, outcome, updated_at]
      properties:
        book_id: {type: string}
        outcome:
          type: string
          enum: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
        title: {type: string}
        author: {type: string}
        asin: {type: string}
        isbn: {type: string}
        cover_url: {type: string, format: uri}
        format: {type: string}
        series: {type: string}
        series_number: {type: string}
        reason: {type: string}
        error: {type: string}
        match_method: {type: string}
        hardcover_book_id: {type: string}
        edition_id: {type: string}
        hardcover_title: {type: string}
        hardcover_author: {type: string}
        hardcover_published_year: {type: string}
        hardcover_cover_url: {type: string, format: uri}
        hardcover_publisher: {type: string}
        hardcover_asin: {type: string}
        hardcover_isbn: {type: string}
        hardcover_slug: {type: string}
        hardcover_series: {type: string}
        hardcover_series_number: {type: string}
        updated_at: {type: string, format: date-time}

    SyncSnapshot:
      type: object
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, unattempted_count, books_total, processed_so_far, outcome_counts, book_outcomes]
      properties:
        profile_id: {type: string}
        audiobookshelf_url:
          type: string
          format: uri
          description: Base URL used to build Audiobookshelf item links in authenticated run details. Omitted from aggregate status responses.
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and would_sync records indicate planned changes.
        run_error:
          type: string
          nullable: true
          description: Run-level error for failed or canceled runs; absent when no run error was recorded.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; when books_total is unknown this remains zero until a denominator is observed.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase. A canceled run retains its partial snapshot; it does not become idle or completed.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet. This is independent of processed_so_far.
        processed_so_far:
          type: integer
          description: Sum of all outcome_counts categories, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'
        book_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'

security:
  - BearerAuth: []

paths:
  /profiles:
    get:
      tags: [Profiles]
      summary: List all sync profiles
      responses:
        '200':
          description: List of sync profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags: [Profiles]
      summary: Create a new sync profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, audiobookshelfUrl, audiobookshelfToken, hardcoverToken]
              properties:
                id:
                  type: string
                  maxLength: 244
                  pattern: '^(?!\.\.?$)[A-Za-z0-9._~-]+$'
                  description: Up to 244 ASCII RFC 3986 unreserved characters; "." and ".." are not valid profile IDs.
                  example: "profile-123"
                name:
                  type: string
                  example: "My Audiobooks"
                audiobookshelfUrl:
                  type: string
                  example: "https://audiobooks.example.com"
                audiobookshelfToken:
                  type: string
                  example: "abs-token-123"
                hardcoverToken:
                  type: string
                  example: "hc-token-456"
                sync_config:
                  $ref: '#/components/schemas/ProfileConfig/properties/sync_config'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}:
    get:
      tags: [Profiles]
      summary: Get a sync profile by ID
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [Profiles]
      summary: Update a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Profile Name"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Profiles]
      summary: Delete a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/config:
    put:
      tags: [Profiles]
      summary: Update a profile's configuration
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Configuration fields may be supplied partially. Omitted config booleans preserve their saved values; explicitly supplied `false` updates the boolean to false. Updating only `sync_config.audnexus_region` preserves `sync_config.dry_run`.
              properties:
                audiobookshelf_url:
                  type: string
                  example: "https://new-audiobooks.example.com"
                audiobookshelf_token:
                  type: string
                  example: "new-abs-token-123"
                hardcover_token:
                  type: string
                  example: "new-hc-token-456"
                sync_config:
                  type: object
                  properties:
                    audnexus_region:
                      type: string
                      description: Region preference stored for the profile. Supported Audnex draft lookup regions are `us`, `ca`, `uk`, `au`, `de`, `fr`, `es`, `in`, `it`, and `jp`. `br` is retained for legacy Hardcover `ASIN:br` sync matching; draft discovery treats it as unsupported, warns, and starts in the US. Other unsupported non-empty values normalize to `us`. An explicit empty string clears the saved preference; omission preserves it.
                    dry_run:
                      type: boolean
                      description: When supplied as `false`, explicitly disables dry run. When omitted from a partial configuration update, preserves the saved value.
                      example: false
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request body or rejected profile state-file path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/runs/{runId}/details:
    get:
      tags: [Status]
      summary: Get full details for an active or retained run of a profile
      description: Returns per-book outcomes when runId identifies the profile's active run or an exact retained terminal report. Unknown, other-profile, and evicted run IDs return 404; the endpoint never substitutes a newer run.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123-1700000000000000000-1"
      responses:
        '200':
          description: Full active or retained run snapshot details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncSnapshot'
        '404':
          description: Profile, active run, or retained run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{id}/edition-drafts/source/{itemID}:
    get:
      tags: [Edition Draft]
      summary: Prepare a read-only edition draft from an Audiobookshelf item
      description: >-
        Fetches the expanded Audiobookshelf item and, for an audiobook with a
        source ASIN, may check Audnex across its supported regions. A complete
        region miss is returned as `unknown`; a rate limit or transient
        discovery failure is returned as `temporarily_unavailable` with a
        retryable warning. A legacy unsupported region preference warns and
        uses US. The endpoint makes no Hardcover requests and performs no
        catalogue writes. Audiobook metadata is preview-only; ebook fields are
        returned as candidates.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
        - name: itemID
          in: path
          required: true
          schema: {type: string}
          description: Audiobookshelf library item ID.
          example: li_8gch9ve09orgn4fdz8
      responses:
        '200':
          description: Source edition draft, including eligibility and any non-fatal warnings.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionSourceDraft'
        '400':
          description: Required profile or Audiobookshelf item ID is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The profile is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The profile could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Audiobookshelf item lookup failed, including when the item was not found upstream, or Audnex returned a non-retryable error. Audnex rate-limit and transient region-discovery failures instead return a successful draft with a retryable warning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Retrieving the Audiobookshelf item timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /status:
    get:
      tags: [Status]
      summary: Get sync status for all profiles
      security: []
      responses:
        '200':
          description: Sync status for all profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregateSyncStatus'
  
  /profiles/{profileId}/sync:
    post:
      tags: [Sync]
      summary: Start a sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '202':
          description: Sync accepted and queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AcceptedSyncRun'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sync already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Sync]
      summary: Cancel an in-progress sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Sync cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found or no sync in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
