openapi: 3.0.3
info:
  title: Audiobookshelf-Hardcover Sync API
  description: |
    This API allows you to manage sync profiles for synchronizing audiobooks between Audiobookshelf and Hardcover.
    
    ## Authentication
    
    The API uses JWT authentication. Include the JWT token in the `Authorization` header:
    
    ```
    Authorization: Bearer <token>
    ```
    
    ## Rate Limiting
    
    The API is rate limited to 100 requests per minute per IP address.
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/drallgood/audiobookshelf-hardcover-sync
servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Profiles
    description: Manage sync profiles
  - name: Sync
    description: Control sync operations
  - name: Status
    description: Check sync status

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Profile not found"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data
    
    Profile:
      type: object
      properties:
        id:
          type: string
          example: "profile-123"
        name:
          type: string
          example: "My Audiobooks"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
    
    ProfileConfig:
      type: object
      properties:
        audiobookshelfUrl:
          type: string
          example: "https://audiobooks.example.com"
        syncConfig:
          type: object
          properties:
            libraryId:
              type: string
              example: "lib1"
            includeTags:
              type: array
              items:
                type: string
              example: ["hardcover"]
            excludeTags:
              type: array
              items:
                type: string
              example: ["exclusive"]
            dryRun:
              type: boolean
              example: false
    
    ProfileWithConfig:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            config:
              $ref: '#/components/schemas/ProfileConfig'
    
    SyncStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, syncing, completed, error]
          example: "idle"
        last_sync:
          type: string
          format: date-time
          nullable: true
          example: "2023-01-01T00:00:00Z"
        progress:
          type: string
          example: "Starting sync..."
        error:
          type: string
          nullable: true
          example: "Connection failed"
        profile_id:
          type: string
        profile_name:
          type: string
        dry_run:
          type: boolean
        books_total:
          type: integer
          description: Number of candidates observed before processing limits.
        books_synced:
          type: integer
          description: Legacy count retained for existing clients.
        books_not_found:
          type: array
          items:
            $ref: '#/components/schemas/BookNotFoundInfo'
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/BookMismatch'
        last_sync_summary:
          type: object
          description: Legacy summary fields retained for existing clients.
        snapshot:
          $ref: '#/components/schemas/SyncSnapshot'

    AggregateSyncStatus:
      type: object
      description: Baseline status exposed by the public aggregate status endpoint.
      properties:
        profile_id:
          type: string
        profile_name:
          type: string
        status:
          type: string
          enum: [idle, syncing, completed, error]
          example: "idle"
        dry_run:
          type: boolean
        last_sync:
          type: string
          format: date-time
          nullable: true
          example: "2023-01-01T00:00:00Z"
        error:
          type: string
          example: "Connection failed"
        progress:
          type: string
          example: "Starting sync..."
        books_total:
          type: integer
          description: Number of candidates observed before processing limits.
        books_synced:
          type: integer
          description: Legacy count retained for existing clients.

    OutcomeCounts:
      type: object
      required: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
      properties:
        synced: {type: integer}
        already_current: {type: integer}
        skipped: {type: integer}
        needs_review: {type: integer}
        not_found: {type: integer}
        failed: {type: integer}
        would_sync: {type: integer}

    BookOutcomeRecord:
      type: object
      required: [book_id, outcome, updated_at]
      properties:
        book_id: {type: string}
        outcome:
          type: string
          enum: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
        title: {type: string}
        author: {type: string}
        asin: {type: string}
        isbn: {type: string}
        reason: {type: string}
        error: {type: string}
        match_method: {type: string}
        hardcover_book_id: {type: string}
        edition_id: {type: string}
        updated_at: {type: string, format: date-time}

    BookNotFoundInfo:
      type: object
      properties:
        book_id: {type: string}
        title: {type: string}
        author: {type: string}
        asin: {type: string}
        isbn: {type: string}
        error: {type: string}

    BookMismatch:
      type: object
      properties:
        book_id: {type: string}
        title: {type: string}
        subtitle: {type: string}
        author: {type: string}
        author_ids:
          type: array
          items: {type: integer}
        narrator: {type: string}
        narrator_ids:
          type: array
          items: {type: integer}
        asin: {type: string}
        isbn: {type: string}
        isbn_10: {type: string}
        isbn_13: {type: string}
        library_id: {type: string}
        folder_id: {type: string}
        release_date: {type: string}
        published_year: {type: string}
        duration_seconds: {type: integer}
        cover_url: {type: string}
        image_url: {type: string}
        edition_format: {type: string}
        edition_information: {type: string}
        language_id: {type: integer}
        country_id: {type: integer}
        publisher_id: {type: integer}
        publisher: {type: string}
        hardcover_book_id: {type: string}
        hardcover_title: {type: string}
        hardcover_author: {type: string}
        hardcover_published_year: {type: string}
        hardcover_cover_url: {type: string}
        hardcover_publisher: {type: string}
        hardcover_asin: {type: string}
        hardcover_isbn: {type: string}
        hardcover_slug: {type: string}
        reason: {type: string}
        timestamp: {type: integer, format: int64}
        attempts: {type: integer}
        created_at: {type: string, format: date-time}

    SyncSnapshot:
      type: object
      required: [run_id, run_started_at, state, books_total, processed_so_far, processed_count, outcome_counts, book_outcomes, attention_records]
      properties:
        user_id: {type: string}
        run_id: {type: string}
        run_started_at: {type: string, format: date-time}
        state:
          type: string
          enum: [idle, syncing, completed, failed]
          description: Cancellation currently clears the live snapshot and returns the profile to idle.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits.
        processed_so_far:
          type: integer
          description: Sum of all outcome_counts categories.
        processed_count:
          type: integer
          description: Alias of processed_so_far for clients that prefer count terminology.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'
        book_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'
        attention_records:
          type: array
          description: Needs-review, not-found, and failed records currently requiring attention.
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'
        total_books_processed: {type: integer}
        books_synced: {type: integer}
        books_not_found:
          type: array
          items:
            $ref: '#/components/schemas/BookNotFoundInfo'
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/BookMismatch'

    SyncSummary:
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/SyncSnapshot'
        user_id: {type: string}
        run_id: {type: string}
        run_started_at: {type: string, format: date-time}
        state: {type: string}
        books_total: {type: integer}
        processed_so_far: {type: integer}
        processed_count: {type: integer}
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'
        book_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'
        attention_records:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'
        total_books_processed: {type: integer}
        books_synced: {type: integer}
        books_not_found:
          type: array
          items:
            $ref: '#/components/schemas/BookNotFoundInfo'
        mismatches:
          type: array
          items:
            $ref: '#/components/schemas/BookMismatch'

security:
  - BearerAuth: []

paths:
  /profiles:
    get:
      tags: [Profiles]
      summary: List all sync profiles
      responses:
        '200':
          description: List of sync profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags: [Profiles]
      summary: Create a new sync profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, audiobookshelfUrl, audiobookshelfToken, hardcoverToken]
              properties:
                id:
                  type: string
                  example: "profile-123"
                name:
                  type: string
                  example: "My Audiobooks"
                audiobookshelfUrl:
                  type: string
                  example: "https://audiobooks.example.com"
                audiobookshelfToken:
                  type: string
                  example: "abs-token-123"
                hardcoverToken:
                  type: string
                  example: "hc-token-456"
                syncConfig:
                  $ref: '#/components/schemas/ProfileConfig/syncConfig'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}:
    get:
      tags: [Profiles]
      summary: Get a sync profile by ID
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [Profiles]
      summary: Update a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Profile Name"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Profiles]
      summary: Delete a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/config:
    put:
      tags: [Profiles]
      summary: Update a profile's configuration
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audiobookshelfUrl:
                  type: string
                  example: "https://new-audiobooks.example.com"
                audiobookshelfToken:
                  type: string
                  example: "new-abs-token-123"
                hardcoverToken:
                  type: string
                  example: "new-hc-token-456"
                syncConfig:
                  $ref: '#/components/schemas/ProfileConfig/syncConfig'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/summary:
    get:
      tags: [Status]
      summary: Get the current-run sync summary for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Current run snapshot and legacy summary fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncSummary'
  /profiles/{profileId}/status:
    get:
      tags: [Status]
      summary: Get sync status for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Current sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncStatus'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /status:
    get:
      tags: [Status]
      summary: Get sync status for all profiles
      security: []
      responses:
        '200':
          description: Sync status for all profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregateSyncStatus'
  
  /profiles/{profileId}/sync:
    post:
      tags: [Sync]
      summary: Start a sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '202':
          description: Sync started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sync already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Sync]
      summary: Cancel an in-progress sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Sync cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found or no sync in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
