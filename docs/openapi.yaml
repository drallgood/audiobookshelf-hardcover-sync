openapi: 3.0.3
info:
  title: Audiobookshelf-Hardcover Sync API
  description: |
    This API allows you to manage sync profiles for synchronizing audiobooks between Audiobookshelf and Hardcover.
    
    ## Authentication
    
    The API uses JWT authentication. Include the JWT token in the `Authorization` header:
    
    ```
    Authorization: Bearer <token>
    ```

    When authentication is enabled, newly created profiles belong to the
    authenticated user. For authenticated `/api/profiles` APIs, users and
    viewers can access only their owned profiles; viewers are read-only, while
    administrators can access all profiles. Profile API responses never echo
    `audiobookshelf_token` or `hardcover_token`, regardless of authentication
    or role. Legacy ownerless profiles are administrator-only: they are not
    listed or accessible to ordinary users, and there is currently no way to
    assign one of these profiles to a user. Foreign and nonexistent profile
    requests return a non-enumerating `404`. The public
    `/api/status` endpoint remains scalar and redacted. Authentication disabled
    preserves unrestricted profile access.

    Unsafe browser requests to profile API routes under `/api/profiles` must
    originate from the same origin, including when authentication is disabled.
    Cross-origin POST, PUT, PATCH,
    and DELETE requests are rejected using Fetch Metadata or Origin checks.
    Nonbrowser clients without those browser headers remain supported. Reverse
    proxies should preserve the public Host and Fetch Metadata headers; clients
    falling back to Origin checks require Origin to match Host. CORS supports
    wildcard origins without browser credentials.
    
    ## Rate Limiting
    
    The API is rate limited to 100 requests per minute per IP address.
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/drallgood/audiobookshelf-hardcover-sync
servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Profiles
    description: Manage sync profiles
  - name: Sync
    description: Control sync operations
  - name: Status
    description: Check sync status
  - name: Edition Draft
    description: Prepare read-only edition candidates from Audiobookshelf source metadata
  - name: Edition Creation
    description: Create a user-requested edition from a verified needs-review run record
  - name: Edition Capability
    description: Report profile-scoped, operation-specific edition-write evidence
  - name: Edition Associations
    description: Inspect and forget profile-scoped local edition matches

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Profile not found"
        error_code:
          type: string
          description: Stable machine-readable code on edition-create and import-recovery errors.
        outcome:
          type: string
          enum: [not_submitted, unconfirmed, failed, created]
          description: >-
            Remote-operation state for edition creation. `created` means
            Hardcover verified the edition but local association saving failed.
        data:
          $ref: '#/components/schemas/EditionImportRecovery'
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data

    AcceptedSyncRun:
      type: object
      required: [message, run_id, state, queued_at, dry_run]
      properties:
        message:
          type: string
          example: Sync started
        run_id:
          type: string
          description: Authoritative ID assigned to the accepted run.
          example: profile-123-1700000000000000000
        state:
          type: string
          enum: [queued]
          description: The accepted run is durably queued before worker launch; response delivery may race worker processing.
        queued_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
          description: True when the accepted run will not perform Hardcover mutations.

    EditionCapabilityStatus:
      type: object
      required: [operation, status, can_attempt]
      properties:
        operation:
          type: string
          enum: [insert_edition, upsert_book]
        status:
          type: string
          enum: [allowed, denied, unverified]
          description: >-
            Ebook and ISBN-based audiobook insert_edition may be allowed from
            the exact validation response returned when its required book_id
            argument is omitted.
            Audiobook upsert_book may be allowed from the exact validation
            response returned when its required book argument is omitted.
            Either operation is denied only for the recognized HTTP 403
            insufficient_scope response. Unverified permits a later eligible,
            user-confirmed attempt with a warning; a profile without a
            Hardcover token is denied. Capability is never inferred from an
            update_edition response.
        can_attempt:
          type: boolean
          description: >-
            False only for a known denied operation. True for allowed or
            unverified; unverified also carries a warning. Dry-run reports
            allowed without probing, while the create endpoint remains
            disabled for dry-run profiles.
        reason:
          type: string
          enum: [hardcover_token_missing, insufficient_scope]
          description: >-
            Present when an attempt is prevented. hardcover_token_missing
            means the profile has no Hardcover token; insufficient_scope means
            the operation's probe received the recognized scope-denial response.
        warning:
          type: string
          enum: [permission_unverified]
          description: Present when status is unverified.

    EditionCapability:
      type: object
      required: [ebook, audiobook_isbn, audiobook, dry_run]
      properties:
        ebook:
          allOf:
            - $ref: '#/components/schemas/EditionCapabilityStatus'
          description: Capability evidence for ebook insert_edition.
        audiobook_isbn:
          allOf:
            - $ref: '#/components/schemas/EditionCapabilityStatus'
          description: >-
            Capability evidence for inserting an audiobook edition from an ISBN;
            uses the same insert_edition operation as ebook creation.
        audiobook:
          allOf:
            - $ref: '#/components/schemas/EditionCapabilityStatus'
          description: Capability evidence for regional Audible upsert_book.
        dry_run:
          type: boolean
          description: The profile dry-run setting. Capability inspection never performs a write.
    
    Profile:
      type: object
      properties:
        id:
          type: string
          example: "profile-123"
        name:
          type: string
          example: "My Audiobooks"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully.
    
    ProfileConfig:
      type: object
      properties:
        audiobookshelf_url:
          type: string
          example: "https://audiobooks.example.com"
        sync_config:
          $ref: '#/components/schemas/SyncConfig'

    SyncConfig:
      type: object
      properties:
        incremental:
          type: boolean
        state_file:
          type: string
          description: Optional relative state-file path. Absolute paths and relative paths that lexically escape the effective data directory are rejected; when paths.data_dir is empty, /data is used. The profile-specific filename component, including the encoded profile ID, must fit the supported 255-byte baseline.
          pattern: '^(?!/).*$'
        min_change_threshold:
          type: integer
        libraries:
          type: object
          properties:
            include:
              type: array
              items:
                type: string
            exclude:
              type: array
              items:
                type: string
        sync_interval:
          type: string
        minimum_progress:
          type: number
        sync_want_to_read:
          type: boolean
        process_unread_books:
          type: boolean
        sync_owned:
          type: boolean
        include_ebooks:
          type: boolean
        dry_run:
          type: boolean
          description: An explicit `false` disables dry run; omission from a partial update preserves the saved value.
          example: false
        test_book_filter:
          type: string
        test_book_limit:
          type: integer
        audnexus_region:
          type: string
          description: Region preference stored for the profile. Values are trimmed and lowercased. `us`, `ca`, `uk`, `au`, `de`, `fr`, `es`, `in`, `it`, and `jp` are supported for Audnexus draft discovery. Unsupported non-empty values warn and normalize to `us`. An explicit empty string clears the saved preference; omitting this field preserves it.
    
    ProfileWithConfig:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            config:
              $ref: '#/components/schemas/ProfileConfig'

    EditionSourceDraft:
      type: object
      description: Read-only edition candidate built from one expanded Audiobookshelf item. The handler reads Audiobookshelf and may read Audnexus; it makes no Hardcover requests and performs no catalogue mutation. For audiobooks, `source_metadata_preview` preserves the Audiobookshelf source values, including the original `publishedDate` or `publishedYear` precision, before enrichment. `metadata_preview` uses Audiobookshelf metadata, including series, position, and cover, with a confirmed Audnexus release-date value when available. `audnexus_details` is present only after Audnexus returns the exact ASIN being previewed in a confirmed region. For an Audible import preview, `audnexus_record` and `audnexus_comparison` are present only after an exact ASIN match in a confirmed region. `ebook_candidate` is present only for ebooks.
      required: [abs_item_id, reading_format, dry_run, eligible, source_identifiers]
      properties:
        abs_item_id:
          type: string
          description: Audiobookshelf library item ID used for this draft.
        reading_format:
          type: string
          enum: [audiobook, ebook]
          description: Format inferred from the expanded Audiobookshelf item.
        dry_run:
          type: boolean
          description: The profile's sync dry-run setting. This draft endpoint itself remains read-only regardless of this value.
        eligible:
          type: boolean
          description: >-
            True when a valid source ASIN (exactly 10 ASCII letters or digits)
            or an ISBN accepted by shape is available. For audiobooks, a valid
            source ASIN selects regional Audible creation and remains
            authoritative when discovery or import fails; an ISBN fallback is
            eligible only when that source ASIN is absent or malformed. A
            malformed non-empty source ASIN is retained in the draft and
            produces an `invalid_source_asin` warning (with `region_status`
            `not_applicable` for audiobooks and Audnexus lookup skipped). An
            ISBN with a bad checksum remains a candidate with a validity warning, so
            checksum warnings do not by themselves make an ISBN-shaped value
            ineligible.
        ineligible_reason:
          type: string
          description: Present when the source item has neither a usable ASIN nor an ISBN accepted by shape; author or date warnings do not change eligibility.
        source_identifiers:
          $ref: '#/components/schemas/EditionDraftSourceIdentifiers'
        region_status:
          type: string
          enum: [confirmed, unknown, temporarily_unavailable, not_applicable]
          description: >-
            Lookup state for the source ASIN, or for the corrected ASIN when
            `audible_identifier` is supplied. `confirmed` means Audnexus returned
            that ASIN in the reported region; `unknown` means lookup completed
            without an exact match or a non-retryable lookup failure occurred;
            `temporarily_unavailable` means a rate-limit, transient, or deadline
            failure stopped lookup; `not_applicable` means the source ASIN is
            absent or malformed and no corrected identifier was supplied.
            Omitted for ebooks.
        confirmed_region:
          type: string
          enum: [us, ca, uk, au, de, fr, es, in, it, jp]
          description: Audnexus region that returned the exact ASIN being previewed. Omitted unless the region is confirmed; it is not inferred from the configured preference.
        audible_identifier_candidate:
          $ref: '#/components/schemas/AudibleIdentifierCandidate'
        metadata_preview:
          allOf:
            - $ref: '#/components/schemas/AudiobookMetadataPreview'
          description: >-
            Enriched audiobook metadata candidate. When a confirmed Audnexus
            record has a recognized release date, `release_date` uses its
            normalized value; otherwise it uses the normalized ABS
            `publishedDate`, then `publishedYear` fallback. The original ABS
            value is available in `source_metadata_preview`.
        source_metadata_preview:
          allOf:
            - $ref: '#/components/schemas/AudiobookMetadataPreview'
          description: >-
            Audiobookshelf source metadata before Audnexus enrichment.
            `release_date` preserves the source `publishedDate` string, or the
            `publishedYear` string when `publishedDate` is empty, including
            year-only precision.
        audnexus_details:
          $ref: '#/components/schemas/AudnexusDetails'
        audnexus_record:
          $ref: '#/components/schemas/AudnexusImportRecord'
        audnexus_comparison:
          $ref: '#/components/schemas/AudnexusFieldComparison'
        ebook_candidate:
          $ref: '#/components/schemas/EbookEditionCandidate'
        warnings:
          type: array
          description: >-
            Non-fatal source or draft issues. Retryable Audnexus failures are
            returned here with `retryable: true` and a
            `temporarily_unavailable` region status; they do not cause a
            guessed region to be returned.
          items:
            $ref: '#/components/schemas/EditionDraftWarning'

    EditionCreateRequest:
      type: object
      additionalProperties: false
      required: [run_id, abs_item_id]
      description: >-
        Identifies one item in one completed or canceled, non-dry-run sync run.
        For a needs-review item with a Hardcover candidate, the API uses the
        recorded Hardcover book ID; clients cannot choose a different book or
        author ID. This adds the edition to the book selected by the sync result.
        An audiobook with reason `audible_import_available` has no Hardcover
        candidate: **Import by Audible ASIN** requires the exact regional
        `audible_identifier` shown in the Audnexus preview and
        `audnexus_confirmed: true`. It does not require selecting a Hardcover
        book first; the request omits `book_id`, and the returned book and
        edition are verified. The source metadata is rechecked before import.
        Other audiobooks with a selected Hardcover book and a valid source ASIN
        use regional Audible import. A valid source ASIN blocks ISBN fallback
        if discovery or import fails. When the source ASIN
        is absent or malformed and no identifier is supplied, a parseable
        Audiobookshelf ISBN can be inserted as an audiobook edition. For an
        audiobook, only `audible_identifier` may be corrected; the remaining
        correction fields apply to ebooks.
      properties:
        run_id:
          type: string
          description: >-
            Exact completed or canceled sync run containing the needs-review item.
        abs_item_id:
          type: string
          description: Audiobookshelf item ID from that run.
        audible_identifier:
          type: string
          description: >-
            Optional audiobook identifier correction in `ASIN:region` form, for
            example `B00XXXYYZZ:uk`. For `audible_import_available`, it is
            required and must exactly match the identifier the user reviewed and
            confirmed; the create request rereads that region. For an audiobook
            tied to a selected Hardcover book, a supplied value is authoritative;
            otherwise the source ASIN region is discovered. Audiobook metadata
            fields are rejected as corrections.
        audnexus_confirmed:
          type: boolean
          description: >-
            Required as `true` for `audible_import_available` imports. It records
            the caller's confirmation that the Audnexus record for the exact
            `audible_identifier` matches the Audiobookshelf item. Omit for the
            selected-book audiobook and ebook paths; setting it to `true` on
            either path returns HTTP 400.
        title:
          type: string
          description: Optional ebook title correction.
        subtitle:
          type: string
          description: Optional ebook subtitle correction.
        asin:
          type: string
          description: Optional ebook ASIN correction.
        isbn_10:
          type: string
          description: Optional ebook ISBN-10 correction; its ISBN-13 counterpart is derived when valid.
        isbn_13:
          type: string
          description: Optional ebook ISBN-13 correction; its ISBN-10 counterpart is derived when valid.
        release_date:
          type: string
          format: date
          description: Optional ebook release-date correction in YYYY-MM-DD form.
        edition_format:
          type: string
          description: Optional ebook edition-format correction.
        resync:
          type: boolean
          default: false
          description: >-
            Opt in to syncing this one book's read status right after the
            edition is created. It runs under the same profile guard and state
            lock as the create, so it never overlaps a full sync.

    EditionResyncResult:
      type: object
      required: [attempted]
      description: >-
        Result of the optional one-book resync. A failed resync does not fail the
        request: the edition already exists and its match is saved.
      properties:
        attempted:
          type: boolean
        outcome:
          type: string
          enum: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
          description: Final per-book sync outcome, present when the resync ran to completion.
        reason:
          type: string
        error:
          type: string
          description: Why the resync could not run or reported a failed outcome.

    EditionCreateResult:
      type: object
      description: >-
        `metadata_preview` is returned for audiobook results and omitted for
        ebooks.
      required: [abs_item_id, reading_format, status, hardcover_book_id, hardcover_edition_id]
      properties:
        abs_item_id:
          type: string
        reading_format:
          type: string
          enum: [audiobook, ebook]
        status:
          type: string
          enum: [loaded, created, existing]
          description: '`loaded` is an audiobook resolver result; `existing` is an ebook duplicate found on the requested book.'
        hardcover_book_id:
          type: string
          description: Verified Hardcover book ID; for `audible_import_available` it is resolved from the regional Audible import.
        hardcover_edition_id:
          type: string
          description: Verified Hardcover edition ID.
        hardcover_title:
          type: string
          description: >-
            Resolved Hardcover book title. Unanchored create and check-import
            may make one additional, time-limited book lookup when the result omits
            its title. This is an informational display value; a failed title
            lookup does not block saving the verified association.
        regional_external_id:
          type: string
          description: >-
            Regional Audible identifier actually used by the import, present
            for audiobook results. When `audible_identifier` corrected the
            source, this reports the imported identifier, which may differ
            from the Audiobookshelf source ASIN.
        metadata_preview:
          $ref: '#/components/schemas/AudiobookMetadataPreview'
        resync:
          $ref: '#/components/schemas/EditionResyncResult'

    EditionImportRecovery:
      type: object
      description: >-
        Recovery identity included only when an audiobook import was submitted
        but not confirmed, or when Hardcover confirmed it but local saving failed.
        The signed token is tied to this profile, sync run, Audiobookshelf item,
        and Audible identifier; imports tied to a selected Hardcover book also
        bind it to the book from the sync record. **Import by Audible ASIN**
        omits `hardcover_book_id`, and `check-import` resolves the book ID from
        the terminal import status or exact regional mapping. Rotating the
        profile's Hardcover token invalidates the token.
      required: [audible_identifier, recovery_token]
      properties:
        audible_identifier:
          type: string
          description: Exact canonical ASIN:region sent to Hardcover for this attempt.
        hardcover_book_id:
          type: string
          description: >-
            Present for imports tied to a selected Hardcover book and taken from
            the verified sync record.
            Omitted for `audible_import_available`; recovery derives the resolved
            ID from Hardcover's terminal import status or exact regional mapping.
        recovery_token:
          type: string
          description: Opaque signed proof that the client received this exact submitted attempt.
        recovery_expires_at:
          type: integer
          format: int64
          description: Unix timestamp of the original recovery token's expiry.

    EditionImportCheckRequest:
      type: object
      additionalProperties: false
      required: [run_id, abs_item_id, audible_identifier, recovery_token]
      properties:
        run_id:
          type: string
        abs_item_id:
          type: string
        audible_identifier:
          type: string
          description: Exact ASIN:region returned in the original ambiguous create response.
        recovery_token:
          type: string
          description: Signed token returned in the original ambiguous create response.

    EditionCreateOutcomeError:
      type: object
      required: [success, error, error_code, outcome]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
          description: Human-readable explanation retained for existing clients.
        error_code:
          type: string
          description: Stable machine-readable edition-create outcome code.
        outcome:
          type: string
          enum: [not_submitted, unconfirmed, failed, created]
        data:
          description: >-
            Recovery data for `unconfirmed` and `created` outcomes, or the
            existing edition for `error_code: hardcover_edition_wrong_format`.
          oneOf:
            - $ref: '#/components/schemas/EditionImportRecovery'
            - $ref: '#/components/schemas/EditionWrongFormat'

    EditionWrongFormat:
      type: object
      description: >-
        Returned with HTTP 409, `outcome: failed`, and `error_code:
        hardcover_edition_wrong_format` when an audiobook create resolves to an
        edition of the reviewed book whose fresh readback is not an audiobook.
        This can happen when an Audible ASIN is also an ISBN-10 carried by a
        non-audiobook edition, or when an ISBN-only audiobook insertion resolves
        to an existing non-audiobook edition. No match is saved and no recovery
        token is returned; resubmitting returns the same edition until
        Hardcover corrects its format.
      required: [hardcover_book_id, hardcover_edition_id, hardcover_edition_url]
      properties:
        hardcover_book_id:
          type: string
        hardcover_edition_id:
          type: string
        reading_format_id:
          type: string
          description: Hardcover reading_format_id from the readback (1 physical, 3 both, 4 ebook).
        hardcover_edition_url:
          type: string
          format: uri
          example: https://hardcover.app/editions/32307716

    EditionDraftSourceIdentifiers:
      type: object
      description: Source identifiers read from Audiobookshelf and trimmed of surrounding whitespace. The ASIN is retained as supplied, is the bare source value, and never includes a region suffix; the source ISBN retains its formatting apart from surrounding whitespace.
      properties:
        asin:
          type: string
          description: Bare Audiobookshelf ASIN, including malformed non-empty source values. A confirmed marketplace and a submitted regional identifier are represented separately.
        isbn:
          type: string
          description: Audiobookshelf's source ISBN, trimmed but otherwise unchanged.

    AudibleIdentifierCandidate:
      type: object
      description: Audiobook identifier candidate. Present for audiobooks, including when no source ASIN is available. It contains the bare source ASIN by default, or the corrected ASIN and region supplied in the `audible_identifier` draft query. Without a confirmed Audnexus result, do not treat an unspecified region as US. This candidate does not write `edition.asin` or create a Hardcover mapping.
      required: [asin, region, correction_allowed]
      properties:
        asin:
          type: string
          description: Bare source ASIN by default, retained with its source casing even when malformed; replaced by the valid ASIN from the query correction when supplied. Empty when neither is available.
        region:
          type: string
          description: Confirmed discovery region, or the explicitly supplied region from `audible_identifier`; consult `region_status` to determine whether Audnexus confirmed it.
        correction_allowed:
          type: boolean
          description: Whether the regional Audible identifier can be corrected in a later add-edition workflow.

    AudnexusDetails:
      type: object
      description: Read-only details from the Audnexus book returned for the exact ASIN being previewed (the source ASIN unless corrected through the draft query) in a confirmed region. Omitted when lookup is unavailable, misses, or returns a different ASIN.
      required: [title]
      properties:
        title: {type: string}
        author:
          type: string
          description: Author names from Audnexus, joined when more than one is present.
        narrator:
          type: string
          description: Narrator names from Audnexus, joined when more than one is present.
        release_date:
          type: string
          format: date
          description: Normalized Audnexus release date when recognized; omitted when Audnexus has no usable date.
        format_type:
          type: string
          description: Audnexus formatType value as returned, without translating it into an abridgment label.

    AudnexusImportRecord:
      type: object
      required: [asin, title]
      description: >-
        Audnexus values from the exact ASIN and region being previewed for an
        Audible import. Omitted when the region is unknown or temporarily
        unavailable. A corrected regional identifier can be previewed through
        the `audible_identifier` query parameter.
      properties:
        asin: {type: string}
        title: {type: string}
        subtitle: {type: string}
        authors:
          type: array
          items: {type: string}
        narrators:
          type: array
          items: {type: string}
        series:
          type: array
          items: {type: string}
        series_position: {type: string}
        publisher: {type: string}
        release_date:
          type: string
          description: Audnexus release date retaining source precision (YYYY, YYYY-MM, or YYYY-MM-DD); recognized timestamps and text dates are normalized.
        runtime_seconds: {type: integer}
        language: {type: string}
        cover_url:
          type: string
          description: Audnexus cover URL as returned.

    AudnexusFieldComparison:
      type: object
      required: [title, subtitle, authors, narrators, series, series_position, publisher, release_date, runtime, language]
      description: >-
        Informational per-field comparison between Audiobookshelf and the
        Audnexus record. Differences do not block creation. Omitted with the
        Audnexus record when no exact regional record is available. The cover
        comparison is omitted because ABS coverPath is a server-local path
        while the Audnexus cover is a URL.
      properties:
        title: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        subtitle: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        authors: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        narrators: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        series: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        series_position: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        publisher: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        release_date: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        runtime: {$ref: '#/components/schemas/AudnexusComparisonStatus'}
        language: {$ref: '#/components/schemas/AudnexusComparisonStatus'}

    AudnexusComparisonStatus:
      type: string
      enum: [match, differs, missing]
      description: >-
        `match` and `differs` use trim-and-case-insensitive comparison for
        strings, normalized dates for recognized release-date formats, and
        rounded seconds for runtime; runtime differences up to 60 seconds are
        treated as a match. `missing` means one side has no value.

    EditionDraftISBNFields:
      type: object
      properties:
        isbn_10:
          type: string
          description: Normalized ISBN-10 candidate when available. A counterpart is present only when it can be derived from a valid source checksum.
        isbn_13:
          type: string
          description: Normalized ISBN-13 candidate when available. A counterpart is present only when it can be derived from a valid source checksum.
        isbn_10_valid:
          type: boolean
          description: Checksum validity for the ISBN-10 value when present.
        isbn_13_valid:
          type: boolean
          description: Checksum validity for the ISBN-13 value when present.

    AudiobookMetadataPreview:
      allOf:
        - $ref: '#/components/schemas/EditionDraftISBNFields'
        - type: object
          description: Read-only audiobook metadata preview. The fields are not editable through this endpoint.
          required: [title, edition_information, audio_seconds]
          properties:
            title: {type: string}
            subtitle: {type: string}
            author: {type: string}
            narrator: {type: string}
            publisher: {type: string}
            description: {type: string}
            language: {type: string}
            release_date:
              type: string
              description: Publication date value associated with this audiobook metadata preview; source and precision depend on the preview variant.
            edition_format: {type: string}
            edition_information:
              type: string
              enum: [Abridged, Unabridged]
            audio_seconds: {type: integer}
            series: {type: string}
            series_position: {type: string}
            cover_url:
              type: string
              format: uri
              description: Audiobookshelf cover URL served through its configured base URL.

    EbookEditionCandidate:
      allOf:
        - $ref: '#/components/schemas/EditionDraftISBNFields'
        - type: object
          description: Ebook candidate fields suitable for a later format-aware add-edition workflow. This GET endpoint does not accept edits or create an edition.
          required: [title, edition_format, corrected_isbn]
          properties:
            title: {type: string}
            subtitle: {type: string}
            author: {type: string}
            asin:
              type: string
              description: Source Kindle ASIN when present.
            release_date:
              type: string
              format: date
              description: Normalized Audiobookshelf published date, falling back to published year when available. Ambiguous slash-formatted dates are ignored in favor of `publishedYear` when available.
            edition_format:
              type: string
              enum: [Ebook]
              description: Fixed to `Ebook` for an ebook candidate.
            corrected_isbn:
              type: string
              description: Optional replacement ISBN slot; empty in the source draft until a user or client supplies a correction to a later workflow.

    EditionDraftWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing_identifier, invalid_isbn, invalid_source_asin, date_unavailable, missing_author, language_defaults_to_english, published_date_unrecognized, published_date_ambiguous, unsupported_audnex_region, audnex_temporarily_unavailable, audnex_lookup_failed, audnex_date_unrecognized]
          description: Current warning code identifying the source or draft issue. `invalid_source_asin` means a non-empty ASIN is not exactly 10 ASCII alphanumeric characters; it does not count toward eligibility, and audiobook region status is `not_applicable` when no corrected identifier is supplied. `invalid_isbn` covers unsupported ISBN shape and a bad checksum; a bad-checksum ISBN that has a supported shape remains eligible, with its validity flag false. Date warnings describe Audiobookshelf source metadata; a confirmed Audnexus release date can still replace the preview date. `published_date_ambiguous` means both month-first and day-first slash parsing succeed, so `publishedYear` is the Audiobookshelf fallback when available.
        message:
          type: string
          description: Human-readable detail for this warning.
        retryable:
          type: boolean
          description: Present and true when the caller can retry after a temporary Audnexus failure; omitted for non-retryable warnings.

    AggregateSyncStatus:
      type: object
      description: Scalar status exposed by the public aggregate status endpoint. Per-book arrays are available from the authenticated run-details endpoint.
      properties:
        profile_id:
          type: string
        profile_name:
          type: string
        last_attempted_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent run was accepted, including dry-run, failed, or canceled runs.
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully; null when no such run exists.
        snapshot:
          $ref: '#/components/schemas/AggregateSnapshot'

    AggregateSnapshot:
      type: object
      description: Scalar current-run snapshot used for inexpensive aggregate polling.
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, books_total, processed_so_far, outcome_counts, unattempted_count]
      properties:
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and a would_sync outcome represents planned work.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase for this run.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; zero when processed_so_far reaches books_total or the total is unknown.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet.
        processed_so_far:
          type: integer
          description: Number of books processed so far, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'

    OutcomeCounts:
      type: object
      required: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
      properties:
        synced: {type: integer}
        already_current: {type: integer}
        skipped: {type: integer}
        needs_review: {type: integer}
        not_found: {type: integer}
        failed: {type: integer}
        would_sync: {type: integer}

    BookOutcomeRecord:
      type: object
      required: [book_id, outcome, updated_at]
      properties:
        book_id: {type: string}
        outcome:
          type: string
          enum: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
        title: {type: string}
        author: {type: string}
        asin: {type: string}
        isbn: {type: string}
        source_asin:
          type: string
          description: Source ASIN normalized to uppercase when it has usable ten-character shape; otherwise trimmed and retained as supplied.
        source_isbn_10:
          type: string
          description: Normalized ISBN-10 form carried by the ABS source ISBN, when it has supported shape.
        source_isbn_13:
          type: string
          description: Normalized ISBN-13 form carried by the ABS source ISBN, when it has supported shape.
        cover_url: {type: string, format: uri}
        format: {type: string}
        series: {type: string}
        series_number: {type: string}
        reason:
          type: string
          description: >-
            For an unmatched audiobook with a usable Audible ASIN (exactly ten
            ASCII letters or digits), the value is `audible_import_available`;
            the outcome remains `needs_review`, the source identifier and format
            snapshot (`source_asin`, `source_isbn_10`, `source_isbn_13`, and
            `format`) is retained, and no Hardcover book or edition ID is set.
            Such items skip title/author discovery.
        error: {type: string}
        match_method: {type: string}
        hardcover_book_id:
          type: string
          description: Omitted when reason is `audible_import_available`.
        edition_id:
          type: string
          description: Omitted when reason is `audible_import_available`.
        edition_added:
          type: boolean
          description: A matching confirmed edition addition is currently saved for this needs-review item. Historical outcomes and counts are unchanged.
        edition_action:
          $ref: '#/components/schemas/EditionActionState'
        hardcover_title: {type: string}
        hardcover_author: {type: string}
        hardcover_published_year: {type: string}
        hardcover_cover_url: {type: string, format: uri}
        hardcover_publisher: {type: string}
        hardcover_asin: {type: string}
        hardcover_isbn: {type: string}
        hardcover_slug: {type: string}
        hardcover_series: {type: string}
        hardcover_series_number: {type: string}
        updated_at: {type: string, format: date-time}

    EditionActionState:
      type: object
      description: >-
        Durable edition request state for this exact profile, run, and item.
        Restores pending recovery, final failure guidance, or safe retry without
        changing historical outcomes or counts. Recovery tokens are returned
        only to callers with profile write access and remain subject to their
        original expiry and Hardcover token binding.
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [unconfirmed, created, transport_unknown, failed, not_submitted]
        http_status:
          type: integer
        error:
          type: string
        error_code:
          type: string
        submitted_body:
          type: object
          description: Original request fields needed to restore the recovery or retry dialog; returned only to callers with profile write access.
          required: [run_id, abs_item_id]
          properties:
            run_id: {type: string}
            abs_item_id: {type: string}
            audible_identifier: {type: string}
          additionalProperties: true
        data:
          description: Recovery data or the final wrong-format edition result, when available.
          type: object
          properties:
            audible_identifier: {type: string}
            hardcover_book_id: {type: string}
            recovery_token:
              type: string
              description: Present only when usable and the caller can change this profile.
            recovery_expires_at:
              type: integer
              format: int64
              description: Original signed recovery expiry, as Unix seconds.
            hardcover_edition_id: {type: string}
            reading_format_id: {type: string}
            hardcover_edition_url: {type: string, format: uri}
            guidance: {type: string}

    SyncSnapshot:
      type: object
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, unattempted_count, books_total, processed_so_far, outcome_counts, book_outcomes]
      properties:
        profile_id: {type: string}
        audiobookshelf_url:
          type: string
          format: uri
          description: Base URL used to build Audiobookshelf item links in authenticated run details. Omitted from aggregate status responses.
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and would_sync records indicate planned changes.
        edition_actions_unavailable:
          type: boolean
          description: True when saved edition state could not be read; edition action projections are omitted and clients must disable edition actions for this run.
        run_error:
          type: string
          nullable: true
          description: Run-level error for failed or canceled runs; absent when no run error was recorded.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; when books_total is unknown this remains zero until a denominator is observed.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase. A canceled run retains its partial snapshot; it does not become idle or completed.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet. This is independent of processed_so_far.
        processed_so_far:
          type: integer
          description: Sum of all outcome_counts categories, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'
        book_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'

security:
  - BearerAuth: []

paths:
  /profiles:
    get:
      tags: [Profiles]
      summary: List all sync profiles
      responses:
        '200':
          description: List of sync profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags: [Profiles]
      summary: Create a new sync profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, audiobookshelf_url, audiobookshelf_token, hardcover_token]
              properties:
                id:
                  type: string
                  maxLength: 244
                  pattern: '^(?!\.\.?$)[A-Za-z0-9._~-]+$'
                  description: Up to 244 ASCII RFC 3986 unreserved characters; "." and ".." are not valid profile IDs.
                  example: "profile-123"
                name:
                  type: string
                  example: "My Audiobooks"
                audiobookshelf_url:
                  type: string
                  example: "https://audiobooks.example.com"
                audiobookshelf_token:
                  type: string
                  example: "abs-token-123"
                hardcover_token:
                  type: string
                  example: "hc-token-456"
                sync_config:
                  $ref: '#/components/schemas/SyncConfig'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '400':
          description: >-
            Invalid request, rejected profile state-file path, or an
            Audiobookshelf URL that is malformed or not permitted by the
            deployment's `audiobookshelf.network_trust` mode. URL errors name
            `audiobookshelf_url` without revealing the configured mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}:
    get:
      tags: [Profiles]
      summary: Get a sync profile by ID
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [Profiles]
      summary: Update a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Profile Name"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Profiles]
      summary: Delete a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/config:
    put:
      tags: [Profiles]
      summary: Update a profile's configuration
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Configuration fields may be supplied partially. Omitted config
                booleans preserve their saved values; explicitly supplied
                `false` updates the boolean to false. Updating only
                `sync_config.audnexus_region` preserves `sync_config.dry_run`.
                Sending `null` for `incremental`, `sync_want_to_read`,
                `process_unread_books`, `sync_owned`, `include_ebooks`,
                `dry_run`, or `audnexus_region` is rejected with HTTP 400.
              properties:
                audiobookshelf_url:
                  type: string
                  example: "https://new-audiobooks.example.com"
                audiobookshelf_token:
                  type: string
                  example: "new-abs-token-123"
                hardcover_token:
                  type: string
                  example: "new-hc-token-456"
                sync_config:
                  $ref: '#/components/schemas/SyncConfig'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: >-
            Invalid request body, rejected profile state-file path, or an
            Audiobookshelf URL that is malformed or not permitted by the
            deployment's `audiobookshelf.network_trust` mode. A saved URL that
            the current mode rejects must be replaced before other settings can
            be updated. URL errors name `audiobookshelf_url` without revealing
            the configured mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/runs/{runId}/details:
    get:
      tags: [Status]
      summary: Get full details for an active or retained run of a profile
      description: Returns per-book outcomes when runId identifies the profile's active run or an exact retained terminal report. Unknown, other-profile, and evicted run IDs return 404; the endpoint never substitutes a newer run.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123-1700000000000000000-1"
      responses:
        '200':
          description: Full active or retained run snapshot details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncSnapshot'
        '404':
          description: Profile, active run, or retained run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{id}/edition-capability:
    get:
      tags: [Edition Capability]
      summary: Report edition capability by creation method
      description: >-
        Requires profile write access. For a live profile, the endpoint probes
        ebook insert_edition without its required book_id argument and
        audiobook upsert_book without its required book argument. Each exact
        missing-argument validation response proves its mutation is available
        before any catalogue write can execute; neither probe supplies a book
        or external ID. `audiobook_isbn` reports the same insert_edition
        capability evidence as `ebook`, because both creation paths use that
        operation. An exact HTTP 403 insufficient_scope response is
        reported denied for either operation; any other result remains
        unverified. Probe outcomes are cached per profile and operation until
        an explicit refresh or a Hardcover token change. A
        dry-run profile skips both probes and reports allowed because it
        performs no catalogue mutation.
        The create endpoint remains disabled for dry-run profiles. A profile
        without a Hardcover token is reported denied for both operations.
        Probe requests use the configured Hardcover request pacing and
        concurrency limit shared by probe, edition-create, and sync clients for
        a profile while its token is unchanged. A token change gets a fresh
        limiter.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
      responses:
        '200':
          description: >-
            Capability evidence for ebook insertion, ISBN-based audiobook
            insertion, and regional Audible audiobook import.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionCapability'
        '400':
          description: Profile ID is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated caller lacks profile mutation access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Profile configuration could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{id}/edition-capability/refresh:
    post:
      tags: [Edition Capability]
      summary: Refresh edition capability evidence by creation method
      description: >-
        Requires profile write access. Reruns both validation-only Hardcover
        permission probes for the current token, replacing any cached result.
        The refresh reuses the profile's configured Hardcover request pacing
        and concurrency limiter. Dry-run profiles continue to skip probes.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
      responses:
        '200':
          description: >-
            Refreshed capability evidence for ebook insertion, ISBN-based
            audiobook insertion, and regional Audible audiobook import.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionCapability'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated caller lacks profile mutation access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Profile configuration could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{id}/edition-drafts/source/{itemID}:
    get:
      tags: [Edition Draft]
      summary: Prepare a read-only edition draft from an Audiobookshelf item
      description: >-
        Fetches the expanded Audiobookshelf item and, for an audiobook with a
        source ASIN, may check Audnexus across its supported regions. If the
        `audible_identifier` query parameter is supplied, it checks only that
        exact ASIN and region instead. A complete
        region miss or non-retryable Audnexus lookup failure returns HTTP 200
        with `region_status: unknown`. A lookup failure also includes a
        non-retryable `audnex_lookup_failed` warning. A rate limit, transient
        failure, or 400/403 Audnexus response is returned as `temporarily_unavailable` with a
        retryable warning. A legacy unsupported region preference warns and
        uses US. The endpoint makes no Hardcover requests and performs no
        catalogue writes. Audiobook metadata is preview-only; ebook fields are
        returned as candidates.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
        - name: itemID
          in: path
          required: true
          schema: {type: string}
          description: Audiobookshelf library item ID.
          example: li_8gch9ve09orgn4fdz8
        - name: audible_identifier
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional corrected audiobook identifier in `ASIN:region` form, for
            example `B00XXXYYZZ:uk`. Its ASIN and supported region are validated
            and used for this preview. The region is queried exactly; it is not
            inferred or swept. This parameter is rejected for ebooks. An unknown
            or temporarily unavailable result has
            no `audnexus_record` or `audnexus_comparison`.
      responses:
        '200':
          description: Source edition draft, including eligibility and any non-fatal warnings.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionSourceDraft'
        '400':
          description: Required profile or Audiobookshelf item ID is missing, the fetched item is not book media, or the corrected `audible_identifier` is invalid or supplied for an ebook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The profile is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The saved Audiobookshelf URL conflicts with the current network trust policy; update the profile URL. Profile writes use 400 for submitted invalid URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Two draft or edition-create requests are already being processed on this server instance; retry after the indicated delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
                example: "1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The profile could not be retrieved because of a server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The Audiobookshelf item lookup failed, including when the item was not found upstream. Audnexus lookup failures return HTTP 200 drafts instead, with region status and warnings describing the failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Retrieving the Audiobookshelf item timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{id}/edition-drafts/create:
    post:
      tags: [Edition Creation]
      summary: Create an edition from a verified needs-review sync record
      description: >-
        Requires profile write access and an explicit user request. The body
        must identify a completed or canceled, non-dry-run sync run and its
        needs-review Audiobookshelf item. The API refetches the item and compares
        its ID, title, author, ASIN, ISBN, and reading format with the verified
        sync record before any Hardcover mutation. For `audible_import_available`,
        the request must set `audnexus_confirmed: true` and provide the exact
        confirmed regional `audible_identifier`; the API rereads that identifier
        in the same region and performs a regional `upsert_book` without
        `book_id`. It does not use a title/author candidate or a caller-supplied
        Hardcover ID. For an audiobook with a selected Hardcover book, it uses
        the Hardcover book ID recorded by the run; no book or author ID is
        accepted from the caller.
        A valid source ASIN or supplied `audible_identifier` selects regional
        `upsert_book`, and a valid source ASIN blocks ISBN fallback if discovery
        or import fails. When the source ASIN is absent or malformed and no
        identifier is supplied, a parseable source ISBN may use format-aware
        audiobook edition creation on the recorded book: a matching audiobook
        edition is reused, otherwise `insert_edition` is used. Ebooks use
        format-aware `insert_edition`; their subtitle and release date come from
        the freshly fetched Audiobookshelf item unless corrected in the request,
        and publisher always comes from the fresh item. The server durably records
        the attempt before a catalogue write and exposes its state as
        `edition_action` in run details. Unresolved or final failed attempts block
        another create for the same run and item; a definitive `not_submitted`
        result allows retry. A successful result is verified and saved as a
        profile-local match before the response is returned. With `resync: true`,
        the book's read status is then synced under the same profile guard and
        state lock, and the result is returned in `resync`; a resync failure is
        reported there and never fails the request. A full sync active for the
        profile refuses the request (409) before any edition is created, with or
        without `resync`.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionCreateRequest'
      responses:
        '200':
          description: Hardcover result verified and local association saved.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionCreateResult'
        '400':
          description: >-
            Profile ID, run ID, or ABS item ID is missing, the JSON request is
            invalid, or an `audible_import_available` request omitted
            `audnexus_confirmed: true` or its confirmed regional identifier.
            Setting `audnexus_confirmed: true` on a selected-book audiobook or
            ebook request is also rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Authenticated caller lacks profile mutation access, or Hardcover
            confirmed the token lacks catalogue-write permission before
            executing the mutation; no edition was created for a confirmed
            catalogue-scope denial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The profile is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Profile details or configuration could not be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The profile is syncing or being deleted, the run/item record is
            stale or no longer usable, a verified source field (item ID, title,
            author, ASIN, ISBN, or reading format) changed, profile dry run is
            enabled, or Hardcover returned an identity conflict. Run a fresh sync
            after source changes. Turn off dry run before creating an edition. For
            an identity conflict, verify the Hardcover result before retrying because
            another edition may have been created. An import resolved to an
            existing non-audiobook edition of the reviewed book returns
            `outcome: failed` with `error_code: hardcover_edition_wrong_format`
            and that edition in `data`. For `audible_import_available`, a reread
            that misses the confirmed ASIN in its exact region or returns a
            different ASIN means the reviewed Audnexus identity changed; refresh
            the draft and confirm the record again. If Hardcover identity
            verification conflicts after submitting an import, verify the result
            before retrying because Hardcover may already have changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The correction fields or identifiers are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            Edition creation capacity is busy or the profile state file is
            locked. Wait for the indicated delay and retry.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; currently 1.
              schema:
                type: string
                example: "1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: >-
            Non-timeout Audiobookshelf client setup or item lookup failed, a
            Hardcover operation or result verification failed, or the remote
            operation succeeded but the local match could not be saved. If a
            Hardcover operation or verification may have completed remotely,
            verify the Hardcover result before retrying because another
            edition may be created. The same guidance applies when local save
            fails after verified remote success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The create service is shutting down, source lookup leaves too little
            time for a Hardcover write (with Retry-After: 1), low or exhausted daily
            Hardcover quota prevents admission before the write deadline, a dependency request timed out,
            source-ASIN Audnexus region discovery was rate limited or transiently
            unavailable, or the Hardcover regional import timed out. For a
            confirmed identifier in **Import by Audible ASIN**, a rate limit or
            transient failure while rereading Audnexus is retryable and no
            Hardcover import is sent.
            Region
            discovery stops before the reserved Hardcover write time; when it
            cannot finish in that time, supply `audible_identifier` to skip it.
            A rate-limit or transient error from Audnexus `GetBookByASIN` for an explicit
            `audible_identifier` is ignored while the request context remains
            active; the supplied region is used and the preview falls back to the
            Audiobookshelf date. If the request context expires during
            Audiobookshelf or Audnexus lookup, the request fails before a Hardcover
            write. If a timeout occurs during a Hardcover mutation, verify the Hardcover
            result before retrying because another edition may have been created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profiles/{id}/edition-drafts/check-import:
    post:
      tags: [Edition Creation]
      summary: Check a previously submitted regional audiobook import
      description: >-
        Requires profile write access and a recovery token returned by an
        ambiguous edition-create response. The API verifies the token against
        the exact profile, run, item, and `ASIN:region`; imports tied to a
        selected Hardcover book also bind the token to the Hardcover book from
        the run. For
        `audible_import_available`, it resolves the Hardcover book ID from the
        terminal regional import status or exact regional mapping, then
        revalidates the retained needs-review snapshot and freshly fetched
        Audiobookshelf source item while holding the profile and state-file
        guards. It performs one read-only Hardcover import-status/mapping query
        and, only for a terminal result, an uncached edition readback that must
        match the resolved Hardcover book and audiobook format. When the resolved
        title is missing, an unanchored import may make one additional
        `GetBookByID` read to populate the informational `hardcover_title`. A pending
        result returns HTTP 503 with `outcome: unconfirmed` and the same recovery
        data; retry this check rather than submitting edition creation again. A
        confirmed result saves the local association and returns the ordinary
        edition-create success shape. Repeating a check for the same saved
        association is idempotent. This endpoint never submits a Hardcover
        mutation or resyncs read status. Rotating the profile's Hardcover token
        invalidates outstanding recovery tokens.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionImportCheckRequest'
      responses:
        '200':
          description: Import verified and local association saved or already matching.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    $ref: '#/components/schemas/EditionCreateResult'
        '400':
          description: Request JSON or one of its required fields is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated caller lacks profile mutation access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The profile is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The recovery token is invalid, the run/item is stale, the source
            changed, profile dry run is enabled, a different local association
            already exists, or Hardcover returned an identity conflict. Refresh
            the draft and inspect the Hardcover result. A terminal import on an
            existing non-audiobook edition returns `outcome: failed` with
            `error_code: hardcover_edition_wrong_format` and that edition in
            `data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionCreateOutcomeError'
        '422':
          description: The submitted Audible identifier is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Edition recovery capacity or profile state is busy.
          headers:
            Retry-After:
              description: Seconds to wait before retrying; currently 1.
              schema:
                type: string
                example: "1"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Hardcover import failed, was not found, or the local association could not be saved after a confirmed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionCreateOutcomeError'
        '503':
          description: >-
            The import remains unconfirmed or a required read was temporarily
            unavailable. The response includes `error_code`, `outcome`, and the
            recovery data while the signed token remains valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditionCreateOutcomeError'

  /profiles/{id}/edition-associations/{itemID}:
    delete:
      tags: [Edition Associations]
      summary: Forget a profile's saved Hardcover edition match for an Audiobookshelf item
      description: >-
        Removes the local association and incremental checkpoint for this item,
        then allows a later sync to run normal matching again. The next sync
        may resolve to the same edition if the Hardcover catalogue is unchanged.
        This action does not delete or modify Hardcover catalogue data. In dry
        run it reports the previous resolution but leaves the saved match and
        checkpoint in place.
        Requests are rejected while the profile is syncing or its state file is
        busy. Removing a match from a legacy profile state file also saves its
        state in the current schema; see MIGRATION.md before downgrading.
        Requires profile mutation access when authentication is enabled.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
          example: profile-123
        - name: itemID
          in: path
          required: true
          schema: {type: string}
          description: Audiobookshelf library item ID; surrounding whitespace is trimmed.
          example: li_8gch9ve09orgn4fdz8
      responses:
        '200':
          description: Association removed, absent (safe no-op), or left unchanged during dry run.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean, enum: [true]}
                  data:
                    type: object
                    required: [abs_item_id, previous_resolution, association_removed, persistent_change_made, dry_run]
                    properties:
                      abs_item_id:
                        type: string
                        description: Trimmed Audiobookshelf item ID addressed by the request.
                      previous_resolution:
                        nullable: true
                        description: Saved local target before the request, or null when no association existed.
                        type: object
                        required: [hardcover_book_id, hardcover_edition_id, reading_format, provenance]
                        properties:
                          hardcover_book_id: {type: string}
                          hardcover_edition_id: {type: string}
                          reading_format: {type: string, enum: [audiobook, ebook]}
                          provenance: {type: string}
                      association_removed:
                        type: boolean
                        description: True when a saved association was removed. Always false during dry run.
                      persistent_change_made:
                        type: boolean
                        description: True when this request removed the association and its incremental checkpoint.
                      dry_run:
                        type: boolean
                        description: Profile dry-run setting; when true, this request leaves the association and checkpoint in place.
        '400':
          description: Required profile ID or Audiobookshelf item ID is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is required when authentication is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated caller lacks profile mutation access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile is unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Profile sync is active, profile deletion is in progress, or the state file is locked by another process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Profile configuration or state file could not be read, migrated, or saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service is shutting down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /status:
    get:
      tags: [Status]
      summary: Get sync status for all profiles
      security: []
      responses:
        '200':
          description: Sync status for all profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregateSyncStatus'
  
  /profiles/{profileId}/sync:
    post:
      tags: [Sync]
      summary: Start a sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '202':
          description: Sync accepted and queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AcceptedSyncRun'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
